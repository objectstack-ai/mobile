name: EAS Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: "Build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - development
          - preview
          - production

permissions:
  contents: read

# One job per platform, so a failing iOS build cannot stop the Android one.
#
# EAS needs an account credential this repo can't provide by default. The secret
# can't be read in a job-level `if`, so each job mirrors it into an env var and
# guards each step — a job is a clean no-op (green) when it's unset.
jobs:
  ios:
    name: EAS Build iOS (${{ inputs.profile || 'preview' }})
    # iOS runs on workflow_dispatch only (platform `ios` or `all`) until Apple
    # signing credentials exist for the EAS project. To build iOS on every push
    # to main as well, replace the `if:` line below with:
    #   if: ${{ github.event_name == 'push' || inputs.platform == 'ios' || inputs.platform == 'all' }}
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platform == 'ios' || inputs.platform == 'all') }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.EXPO_TOKEN != '' }}
      - uses: pnpm/action-setup@v4
        if: ${{ env.EXPO_TOKEN != '' }}
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: ${{ env.EXPO_TOKEN != '' }}
        with:
          node-version: 22
          cache: pnpm
      - uses: expo/expo-github-action@v8
        if: ${{ env.EXPO_TOKEN != '' }}
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install
        if: ${{ env.EXPO_TOKEN != '' }}
      - name: Build iOS
        if: ${{ env.EXPO_TOKEN != '' }}
        run: eas build --platform ios --profile ${{ inputs.profile || 'preview' }} --non-interactive

  android:
    name: EAS Build Android (${{ inputs.profile || 'preview' }})
    # Every push to main builds Android with the `preview` profile; a
    # workflow_dispatch builds it for platform `android` or `all`.
    if: ${{ github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'all' }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.EXPO_TOKEN != '' }}
      - uses: pnpm/action-setup@v4
        if: ${{ env.EXPO_TOKEN != '' }}
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: ${{ env.EXPO_TOKEN != '' }}
        with:
          node-version: 22
          cache: pnpm
      - uses: expo/expo-github-action@v8
        if: ${{ env.EXPO_TOKEN != '' }}
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install
        if: ${{ env.EXPO_TOKEN != '' }}
      - name: Build Android
        if: ${{ env.EXPO_TOKEN != '' }}
        run: eas build --platform android --profile ${{ inputs.profile || 'preview' }} --non-interactive
